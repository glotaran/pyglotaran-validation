name: "pyglotaran validation"
description: "Run pyglotaran validation to confirm validity of results"
author: "Sebastian Weigand"
inputs:
  validation_name:
    description: "Which validator to run {all, pyglotaran-examples}"
    default: "all"
    required: true
  comparison_mode:
    description: "Comparison mode {legacy, semantic}"
    default: "legacy"
    required: false
  reference_root:
    description: "Root containing the reference result tree"
    default: "comparison-results"
    required: false
  current_root:
    description: "Root containing the current result tree"
    default: "comparison-results-current"
    required: false
  report_path:
    description: "Path for the semantic comparison report"
    default: "semantic-report.json"
    required: false

runs:
  using: "composite"
  steps:
    - name: Validate validator inputs
      shell: bash
      env:
        COMPARISON_MODE: ${{ inputs.comparison_mode }}
        VALIDATION_NAME: ${{ inputs.validation_name }}
      run: |
        case "$COMPARISON_MODE" in
          legacy|semantic) ;;
          *)
            echo "::error::comparison_mode must be legacy or semantic" >&2
            exit 2
            ;;
        esac
        case "$VALIDATION_NAME" in
          all|pyglotaran-examples) ;;
          *)
            echo "::error::validation_name must be all or pyglotaran-examples" >&2
            exit 2
            ;;
        esac

    - name: Install requirements
      shell: bash
      run: |
        pip install -r ${{ github.action_path }}/requirements.txt

    - name: Run all validation tests
      shell: bash
      if: inputs.comparison_mode == 'legacy' && inputs.validation_name == 'all'
      env:
        ACTION_PATH: ${{ github.action_path }}
        PYGLOTARAN_REFERENCE_ROOT: ${{ inputs.reference_root }}
        PYGLOTARAN_CURRENT_ROOT: ${{ inputs.current_root }}
      run: |
        pytest "$ACTION_PATH"

    - name: Run ${{ inputs.validation_name }} validation tests
      shell: bash
      if: inputs.comparison_mode == 'legacy' && inputs.validation_name != 'all'
      env:
        ACTION_PATH: ${{ github.action_path }}
        VALIDATION_NAME: ${{ inputs.validation_name }}
        PYGLOTARAN_REFERENCE_ROOT: ${{ inputs.reference_root }}
        PYGLOTARAN_CURRENT_ROOT: ${{ inputs.current_root }}
      run: |
        pytest -ra "$ACTION_PATH/$VALIDATION_NAME"

    - name: Run semantic result comparison
      shell: bash
      if: inputs.comparison_mode == 'semantic'
      env:
        REFERENCE_ROOT: ${{ inputs.reference_root }}
        CURRENT_ROOT: ${{ inputs.current_root }}
        REPORT_PATH: ${{ inputs.report_path }}
        SEMANTIC_SCRIPT: ${{ github.action_path }}/semantic/compare_results.py
        SEMANTIC_MANIFEST: ${{ github.action_path }}/semantic/scenarios.yml
      run: |
        python "$SEMANTIC_SCRIPT" \
          --main-root "$REFERENCE_ROOT" \
          --staging-root "$CURRENT_ROOT" \
          --manifest "$SEMANTIC_MANIFEST" \
          --output "$REPORT_PATH"
